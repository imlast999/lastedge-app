pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  def inputAutolinkFile = file("build/generated/autolinking/autolinking_input.json")
  inputAutolinkFile.parentFile.mkdirs()
  
  def rnConfigOutput = providers.exec {
    workingDir(rootDir.parentFile)
    commandLine("node", "--no-warnings", "--eval", "require('expo/bin/autolinking')", "expo-modules-autolinking", "react-native-config", "--platform", "android", "--json")
  }.standardOutput.asText.get()
  
  if (new File("C:/M").exists()) {
    rnConfigOutput = rnConfigOutput
      .replace("C:\\\\LastEdge\\\\LastEdge App\\\\mobile-app\\\\artifacts\\\\mobile", "C:\\\\M")
      .replace("C:/LastEdge/LastEdge App/mobile-app/artifacts/mobile", "C:/M")
      .replace("C:\\LastEdge\\LastEdge App\\mobile-app\\artifacts\\mobile", "C:\\M")
      .replace("C:\\\\LE\\\\mobile-app\\\\artifacts\\\\mobile", "C:\\\\M")
      .replace("C:/LE/mobile-app/artifacts/mobile", "C:/M")
      .replace("C:\\LE\\mobile-app\\artifacts\\mobile", "C:\\M")
    def moduleMap = [
      "react-native-keyboard-contr_ec857121a21aa451dd0f86aa24cc60b2/node_modules/react-native-keyboard-controller": "C:/k",
      "react-native-screens@4.16.0_e0e9489fc898c84fbe4bb926eacc799d/node_modules/react-native-screens": "C:/s",
      "react-native-svg@15.12.1_re_6dc001472c9df3127bd9f6cb603b1369/node_modules/react-native-svg": "C:/v",
      "react-native-safe-area-cont_e99969b06e7c321d1a21c9e0f5ec4abe/node_modules/react-native-safe-area-context": "C:/a",
      "react-native-gesture-handle_b5369b7359ec8c3c0a5224abd7dc8561/node_modules/react-native-gesture-handler": "C:/g",
      "@react-native-async-storage_a98614c4a6212818cc26ef036ab07220/node_modules/@react-native-async-storage/async-storage": "C:/y"
    ]

    moduleMap.each { pnpmSub, shortTarget ->
      def winPnpmSub = pnpmSub.replace("/", "\\\\")
      def winShort = shortTarget.replace("/", "\\\\")
      rnConfigOutput = rnConfigOutput
        .replace("C:\\\\M\\\\node_modules\\\\.pnpm\\\\" + winPnpmSub, winShort)
        .replace("C:/M/node_modules/.pnpm/" + pnpmSub, shortTarget)
        .replace("C:\\\\P\\\\" + winPnpmSub, winShort)
        .replace("C:/P/" + pnpmSub, shortTarget)
    }

    if (new File("C:/P").exists()) {
      rnConfigOutput = rnConfigOutput
        .replace("C:\\\\M\\\\node_modules\\\\.pnpm", "C:\\\\P")
        .replace("C:/M/node_modules/.pnpm", "C:/P")
        .replace("C:\\M\\node_modules\\.pnpm", "C:\\P")
    }
  } else if (new File("C:/LE").exists()) {
    rnConfigOutput = rnConfigOutput.replace("LastEdge\\\\LastEdge App", "LE").replace("LastEdge/LastEdge App", "LE").replace("LastEdge\\LastEdge App", "LE")
  }
  inputAutolinkFile.text = rnConfigOutput
  ex.autolinkLibrariesFromConfigFile(inputAutolinkFile)
}
expoAutolinking.useExpoModules()

rootProject.name = 'LastEdge'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
