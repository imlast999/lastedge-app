name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crear GitHub Release con el APK'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Marcar como Pre-release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - 'scripts/sync_version.py'
      - 'VERSION'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package LastEdge APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Dynamic App Version
        id: sync_version
        run: |
          python scripts/sync_version.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'mobile-app/pnpm-lock.yaml'

      - name: Install Monorepo Dependencies
        run: |
          cd mobile-app
          pnpm install --no-frozen-lockfile

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Release APK
        run: |
          cd mobile-app/artifacts/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Prepare APK Output
        id: prepare_apk
        run: |
          VERSION="${{ steps.sync_version.outputs.VERSION }}"
          BUILD_DIR="mobile-app/artifacts/mobile/android/app/build/outputs/apk/release"
          APK_PATH=$(find "$BUILD_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in $BUILD_DIR"
            exit 1
          fi
          TARGET_NAME="LastEdge-v${VERSION}.apk"
          TARGET_PATH="${BUILD_DIR}/${TARGET_NAME}"
          cp "$APK_PATH" "$TARGET_PATH"
          echo "apk_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${TARGET_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Built APK ready: ${TARGET_NAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Generate Semantic Release Notes & Changelog
        id: release_notes
        run: |
          python scripts/generate_release_notes.py

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_apk.outputs.version }}
          name: LastEdge Mobile v${{ steps.prepare_apk.outputs.version }}
          make_latest: true
          body_path: release_notes.md
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == true || github.event.inputs.prerelease == 'true' }}

      - name: Commit & Push README Version Updates
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md VERSION mobile-app/package.json mobile-app/artifacts/mobile/package.json mobile-app/artifacts/mobile/app.json mobile-app/artifacts/mobile/android/app/build.gradle
          git diff --staged --quiet || git commit -m "chore(release): sync README and metadata for v${{ steps.prepare_apk.outputs.version }} [skip ci]"
          git push origin main || echo "No changes to push or conflict avoided"

      - name: Broadcast Release to Telegram & Discord
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true') && success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          python scripts/notify_bots.py \
            --event release \
            --version "${{ steps.prepare_apk.outputs.version }}" \
            --apk-name "${{ steps.prepare_apk.outputs.apk_name }}" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/v${{ steps.prepare_apk.outputs.version }}/${{ steps.prepare_apk.outputs.apk_name }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.prepare_apk.outputs.version }}" \
            --commit "${{ github.sha }}" \
            --changelog "release_summary.txt"
