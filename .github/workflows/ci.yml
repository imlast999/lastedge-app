name: App & Control Plane CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend & Control Plane (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Syntax Validation
        run: |
          python -m compileall services tests

      - name: Client & Adapter Verification
        run: |
          python -c "from services.clients.trading_client import TradingClient; from services.clients.research_client import ResearchClient; print('App Clients & Adapters Verified')"

      - name: Run Test Suite (11 Tests)
        env:
          PYTHONPATH: .
          LOG_LEVEL: ERROR
        run: |
          pytest tests/ -v --tb=short
